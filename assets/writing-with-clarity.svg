<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Writing with clarity</title>
  <desc id="desc">A writing notebook and pencil beside a clear message.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b382b" flood-opacity=".14"/>
    </filter>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1" fill="#496454" opacity=".08"/>
      <circle cx="19" cy="17" r="1" fill="#496454" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#e1ede5"/>
  <rect width="1200" height="675" fill="url(#grain)"/>
  <rect x="62" y="62" width="1076" height="551" rx="20" fill="#faf9f2" filter="url(#shadow)"/>
  <path d="M62 82a20 20 0 0 1 20-20h1076v10H62z" fill="#c36d4f"/>
  <text x="128" y="157" fill="#b75f43" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">COMMUNICATION  /  01</text>
  <text x="124" y="274" fill="#235b44" font-family="Georgia,serif" font-size="86" font-weight="700">Writing</text>
  <text x="124" y="378" fill="#235b44" font-family="Georgia,serif" font-size="86" font-weight="700">with clarity</text>
  <rect x="130" y="420" width="90" height="6" rx="3" fill="#c36d4f"/>
  <text x="128" y="480" fill="#69776d" font-family="Arial,sans-serif" font-size="25">One clear idea. Thoughtfully expressed.</text>
  <text x="762" y="138" fill="#b75f43" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">PLAN</text>
  <rect x="732" y="171" width="306" height="359" fill="#ffffff" stroke="#dce3da" stroke-width="2"/>
  <rect x="732" y="171" width="9" height="359" fill="#c36d4f"/>
  <text x="774" y="218" fill="#235b44" font-family="Arial,sans-serif" font-size="18" font-weight="700">A clear message</text>
  <path d="M774 246h208M774 269h230M774 292h172" stroke="#dce7de" stroke-width="7" stroke-linecap="round"/>
  <text x="774" y="352" fill="#69776d" font-family="Arial,sans-serif" font-size="17">Remove what distracts.</text>
  <path d="M774 381h214M774 404h184M774 427h206" stroke="#dce7de" stroke-width="7" stroke-linecap="round"/>
  <text x="774" y="486" fill="#b75f43" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">EDIT WITH PURPOSE</text>
  <g transform="rotate(14 1050 395)">
    <rect x="1023" y="270" width="45" height="260" rx="9" fill="#c36d4f"/>
    <rect x="1034" y="278" width="8" height="245" fill="#e9a17e" opacity=".8"/>
    <path d="M1023 530h45l-22.5 58z" fill="#235b44"/>
    <path d="M1046 572l-4 13 9-10z" fill="#273b33"/>
    <path d="M1023 291h45" stroke="#f4d1ba" stroke-width="5"/>
  </g>
